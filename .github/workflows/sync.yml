# 上游镜像同步。
#
# 这里只把 huilang-me/CF-Server-Monitor 的 main 同步到本 fork 的 upstream 分支，
# 用来随时查看上游进展；**不要**把它指回 main——main 上有本地功能
# （例如服务端的跨重启累计流量），Fork-Sync 是强制覆盖式同步，
# 指向 main 会把本地提交直接冲掉。要把上游并进来时，手动 merge 更安全。
name: Upstream Mirror

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          # 同步目标是 upstream 镜像分支，默认只拉当前分支会 checkout 不到它
          fetch-depth: 0

      # Step 2: run the sync action
      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: huilang-me/CF-Server-Monitor
          upstream_sync_branch: main
          target_sync_branch: upstream
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set

          # Set test_mode true to run tests instead of the true action!!
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 上游镜像同步失败（常见原因：上游改动了 workflow 文件，GitHub 会暂停本次同步）。"
          echo "[Error] 这只影响 upstream 镜像分支，main 不受影响；需要更新镜像时可在 Actions 里手动重跑。"
          exit 1
